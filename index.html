<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pack Standard</title>

  <meta property="og:title" content="Pack Standard" />
  <meta property="og:description" content="Pack Standard" />
  <meta property="og:image" content="https://packstandard.com/PS_Website_Mockup.jpg" />
  <meta property="og:url" content="https://packstandard.com" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pack Standard" />
  <meta name="twitter:description" content="Pack Standard" />
  <meta name="twitter:image" content="https://packstandard.com/PS_Website_Mockup.jpg" />

  <style>
    :root {
      --bg: #264026;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .logo {
      width: min(18vw, 260px);
      height: auto;
    }

    @media (max-width: 640px) {
      .logo {
        width: 45vw;
      }
    }
  </style>
</head>
<body>
  <img src="PS_Website_Logo.svg" alt="Pack Standard" class="logo" />
</body>
</html>
